<!doctype html>
<html lang="en">
  <head>
    <title>Minimal Configurator Example</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #rubens-configurator {
        width: 100%;
        height: 100%;
      }
      #rubens-configurator iframe {
        border: none;
      }
    </style>

    <div id="rubens-configurator"></div>

    <script type="module">
      import RoomleConfiguratorApi from 'https://cdn.jsdelivr.net/npm/@roomle/embedding-lib@0.0.0-dev-9d077e2/roomle-embedding-lib.js';
      import { startConfiguratorPlanningAssistant } from 'https://cdn.jsdelivr.net/npm/@roomle/embedding-lib@0.0.0-dev-9d077e2/configurator.js';
      const options = Object.fromEntries(new URLSearchParams(location.search));
      const id = options.id ?? 'usm:frame';
      const chat = options.chat === 'true';
      delete options.id;
      delete options.chat;
      if (chat) options.featureFlags = { planningAssistant: true };
      const instance = await RoomleConfiguratorApi.createConfigurator(
        'demoConfigurator',
        document.getElementById('rubens-configurator'),
        options
      );
      await instance.ui.loadObject(id);
      window.instance = instance;
      if (chat) {
        const controller = new AbortController();
        window.addEventListener('pagehide', () => controller.abort(), {
          once: true,
        });
        try {
          const response = await fetch('/planning-assistant-config.json');
          if (!response.ok)
            throw new Error(
              'Start the example with npm start <model> <api-key>.'
            );
          await startConfiguratorPlanningAssistant(
            { configurator: instance.extended, window: instance.extended },
            await response.json(),
            controller.signal
          );
        } catch (error) {
          instance.extended.planningAssistantOutput({
            type: 'availability',
            available: false,
            text: error.message,
          });
        }
      }
    </script>
  </body>
</html>
